name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execução anterior da mesma ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (astro check)
        run: npm run typecheck

      # O build precede os testes: o smoke test verifica o dist/ gerado, e é
      # essa ordem que garante que a asserção seja sobre HTML real.
      - name: Build
        run: npm run build

      - name: Testes (Vitest)
        run: npm test

      - name: Publicar o site construído
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
