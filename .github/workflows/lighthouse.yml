name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Performance e acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      # As asserções estão em `warn` enquanto se estabelece a linha de base do
      # runner. Viram `error` quando houver histórico suficiente para separar
      # regressão real de ruído de ambiente — ver spec/architecture.md.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
